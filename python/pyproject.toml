[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-modrinth"
version = "0.1.0"
description = "Crawlora Modrinth API client with 34 endpoints for project search and metadata, versions, dependencies, collections, organizations, and file compatibility"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "modrinth", "modrinth-api", "modrinth-scraper", "modrinth-data", "modrinth-project-search-metadata", "modrinth-versions", "modrinth-dependencies", "modrinth-collections", "modrinth-organizations", "modrinth-file-compatibility"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=modrinth-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=modrinth-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-modrinth"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_modrinth"]

[tool.setuptools.package-data]
"crawlora_modrinth" = ["py.typed", "*.pyi"]
